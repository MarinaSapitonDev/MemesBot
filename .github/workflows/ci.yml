# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 19
      uses: actions/setup-java@v4
      with:
        java-version: '19'
        distribution: 'temurin'
        cache: maven
    - name: Use secrets for configuration 
      env: 
         BOT_TOKEN: ${{secrets.BOT_TOKEN}}
      run:
          echo "Runnin the bot with bot token $BOT_TOKEN"
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Build and push docker image 

      uses: mr-smithers-excellent/docker-build-push@v6
      with:
           image: marinasapiton/memesbot
           tags: latest
           registry: docker.io
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}
           
    - name: Deploy the image to AWS ECS  
    
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        image: sapiton/memesbot
        tags: latest
        registry: 352159925910.dkr.ecr.eu-north-1.amazonaws.com
    env:
       AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
       AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  
